<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <!-- 顶部导航栏 -->
  <div class="top-nav">
    <div class="nav-item active">行情工具</div>
    <div class="nav-item">资讯</div>
    <div class="nav-item">牛牛周</div>
    <div class="nav-item">关于我们</div>
    <div class="nav-item">帮助</div>
  </div>

  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="logo">📈 富途牛牛</div>
    <button class="favorites-btn">❤️ 自选</button>
    
    <div class="market-section">
        <h4>美股市场</h4>
        <div class="market-index up">
          <div class="index-name">道琼斯ETF（DIA）</div>
          <div class="index-value" id="dji-value">--</div>
          <div class="index-change" id="dji-change">--</div>
        </div>
        <div class="market-index up">
          <div class="index-name">纳斯达克ETF（QQQ）</div>
          <div class="index-value" id="ixic-value">--</div>
          <div class="index-change" id="ixic-change">--</div>
        </div>
        <div class="market-index up">
          <div class="index-name">标普500ETF（SPY）</div>
          <div class="index-value" id="gspc-value">--</div>
          <div class="index-change" id="gspc-change">--</div>
        </div>
      </div>
      
    
    <div class="stock-categories">
      <h4>全部股票</h4>
      <div class="category active">全部美股</div>
      <div class="category">涨幅榜</div>
      <div class="category">跌幅榜</div>
      <div class="category">市值榜</div>
      <div class="category">成交量榜</div>
      <div class="category">成交额榜</div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main">
    <div class="stock-table-container">
      <table class="stock-table">
        <thead>
          <tr>
            <th>序号</th>
            <th>代码</th>
            <th>股票名称</th>
            <th>最新价</th>
            <th>涨跌额</th>
            <th>涨跌幅</th>
            <th>成交量</th>
            <th>自选</th>
          </tr>
        </thead>
        <tbody id="stock-table">
          <!-- 股票数据将通过JS动态填充 -->
        </tbody>
      </table>
      <div class="table-footer">
        07/27 22:43（美元）
      </div>
    </div>
  </div>
</div>

<script>
    async function renderStockTable() {
      const tbody = document.getElementById('stock-table');
      tbody.innerHTML = '';
  
      try {
        const res = await fetch('/api/quote/all');
        const data = await res.json();
  
        data.forEach((stock, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${stock.ticker}</td>
            <td>${stock.ticker}</td>
            <td>${stock.price.toFixed(2)}</td>
            <td class="${stock.change >= 0 ? 'up' : 'down'}">${stock.change >= 0 ? '+' : ''}${stock.change.toFixed(2)}</td>
            <td class="${stock.changePercent >= 0 ? 'up' : 'down'}">${stock.changePercent >= 0 ? '+' : ''}${stock.changePercent.toFixed(2)}%</td>
            <td>${Number(stock.volume).toLocaleString()}</td>
            <td><div class="favorite-star">○</div></td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load stock data:', err);
      }
    }
  
    async function renderIndices() {
  try {
    const res = await fetch('/api/quote/market');
    const data = await res.json();

    data.forEach(index => {
      const symbol = index.symbol.toUpperCase();
      let id = null;

      if (symbol === 'DIA') id = 'dji';
      else if (symbol === 'QQQ') id = 'ixic';
      else if (symbol === 'SPY') id = 'gspc';

      if (id) {
        const valueEl = document.getElementById(`${id}-value`);
        const changeEl = document.getElementById(`${id}-change`);
        const change = index.change.toFixed(2);
        const pct = index.changePercent.toFixed(2);
        const isUp = index.change >= 0;

        valueEl.textContent = index.price.toFixed(2);
        changeEl.textContent = `${isUp ? '+' : ''}${change} ${isUp ? '+' : ''}${pct}%`;
        valueEl.parentElement.classList.toggle('up', isUp);
        valueEl.parentElement.classList.toggle('down', !isUp);
      }
    });
  } catch (err) {
    console.error('Failed to load indices:', err);
  }
}


  
    document.addEventListener('DOMContentLoaded', () => {
      renderStockTable();
      renderIndices();
    });
  </script>
  
  
</body>
</html>
