<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    h2 { margin-top: 40px; text-align: center; }
    table { border-collapse: collapse; width: 90%; margin: 20px auto; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    canvas { max-width: 800px; margin: 30px auto; display: block; background: #fff; padding: 10px; }
    .button { display: block; margin: 30px auto; padding: 10px 20px; font-size: 16px; }
    .green { color: green; }
    .red { color: red; }
  </style>
</head>
<body>

<h1 style="text-align: center;">📊 投资组合对比 Dashboard</h1>

<h2>📋 Portfolio 1 组成</h2>
<table id="portfolio1-table">
  <thead>
    <tr><th>股票代码</th><th>当前价格</th><th>涨跌幅</th></tr>
  </thead>
  <tbody></tbody>
</table>

<h2>📋 Portfolio 2 组成</h2>
<table id="portfolio2-table">
  <thead>
    <tr><th>股票代码</th><th>当前价格</th><th>涨跌幅</th></tr>
  </thead>
  <tbody></tbody>
</table>

<h2>📈 收益曲线</h2>
<canvas id="performanceChart"></canvas>

<h2>📊 总结比较</h2>
<table>
  <thead><tr><th>组合</th><th>平均涨幅</th><th>总收益</th></tr></thead>
  <tbody>
    <tr><td>Portfolio 1</td><td id="avg1"></td><td id="sum1"></td></tr>
    <tr><td>Portfolio 2</td><td id="avg2"></td><td id="sum2"></td></tr>
  </tbody>
</table>

<button class="button" onclick="location.href='index.html'">🔙 回到首页</button>

<script>
  const portfolio1 = ['AAPL', 'TSLA'];
  const portfolio2 = ['GOOG', 'NVDA'];
  const baseUrl = 'http://localhost:3001/api/quote/';

  const prices1 = [], prices2 = [];

  async function loadPortfolio(portfolio, tableId, priceList, avgId, sumId) {
    const tbody = document.querySelector(tableId);
    for (const ticker of portfolio) {
      const res = await fetch(baseUrl + ticker);
      const data = await res.json();

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${data.ticker}</td>
        <td>$${data.price.toFixed(2)}</td>
        <td class="${data.changePercent >= 0 ? 'green' : 'red'}">
          ${data.changePercent >= 0 ? '+' : ''}${data.changePercent.toFixed(2)}%
        </td>`;

      tbody.appendChild(row);

      priceList.push(data.price);
    }
  }

  async function init() {
    await loadPortfolio(portfolio1, "#portfolio1-table tbody", prices1);
    await loadPortfolio(portfolio2, "#portfolio2-table tbody", prices2);

    const avg1 = (prices1.reduce((a, b) => a + b) / prices1.length).toFixed(2);
    const sum1 = prices1.reduce((a, b) => a + b).toFixed(2);
    const avg2 = (prices2.reduce((a, b) => a + b) / prices2.length).toFixed(2);
    const sum2 = prices2.reduce((a, b) => a + b).toFixed(2);

    document.getElementById("avg1").textContent = `$${avg1}`;
    document.getElementById("sum1").textContent = `$${sum1}`;
    document.getElementById("avg2").textContent = `$${avg2}`;
    document.getElementById("sum2").textContent = `$${sum2}`;

    drawChart();
  }

  function drawChart() {
    const labels = ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5"];
    const data1 = [0, 0.01, 0.02, 0.03, 0.05];
    const data2 = [0, 0.02, 0.015, 0.035, 0.06];

    const ctx = document.getElementById("performanceChart").getContext("2d");
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Portfolio 1',
            data: data1,
            borderColor: 'blue',
            fill: false
          },
          {
            label: 'Portfolio 2',
            data: data2,
            borderColor: 'green',
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: '累计收益曲线（模拟）'
          }
        },
        scales: {
          y: {
            ticks: {
              callback: val => (val * 100).toFixed(1) + '%'
            },
            title: { display: true, text: '收益率' }
          }
        }
      }
    });
  }

  init();
</script>

</body>
</html>
